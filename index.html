<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f8f9f6" />
  <meta name="description" content="식품의 소비기한을 관리하는 wesee" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/wesee.svg" type="image/svg+xml" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="wesee" />
  <link rel="apple-touch-icon" href="icons/wesee.svg" />
  <title>wesee — 내 제품</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/styles.css" />
  <link rel="stylesheet" href="/src/styles/webapp.css" />
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <a class="brand" href="#home" data-go="home" aria-label="wesee 내 제품으로 이동"><span class="brand-mark" aria-hidden="true">w</span><span>wesee</span></a>
      <h1 id="crumb-current">내 제품</h1>
      <nav class="side-nav" aria-label="주 메뉴">
        <button class="nav-link active" data-page="home">내 제품</button>
        <a class="nav-link" href="/voiceover.html">음성 안내</a>
      </nav>
      <button class="install-button hidden" id="install-app" type="button">앱 설치</button>
    </header>

    <main class="main-area">
      <section class="page-view" id="home-page">
        <div class="notice-banner" role="note">소비기한이 가까운 제품부터 확인해 보세요.</div>
        <button class="button button-primary register-product-button" data-go="upload" type="button">제품 등록하기</button>
        <section class="products-panel" aria-label="내 제품 목록">
          <div class="section-heading">
            <label class="search-box"><span aria-hidden="true">⌕</span><input id="product-search" type="search" placeholder="제품명 검색" aria-label="제품명 검색" /></label>
          </div>
          <div class="filter-row" role="group" aria-label="제품 필터">
            <button class="filter-chip selected" data-filter="all">전체 <span id="filter-all-count">0</span></button>
            <button class="filter-chip" data-filter="soon">곧 소비기한</button>
            <button class="filter-chip" data-filter="expired">기한 지남</button>
          </div>
          <div id="product-list" class="product-list"></div>
        </section>
      </section>

      <section class="page-view hidden" id="upload-page">
        <p class="page-description">제품명과 소비기한이 보이도록 사진을 추가해 주세요.</p>
        <section class="upload-panel" aria-label="제품 사진 등록">
          <div class="drop-zone" id="drop-zone">
            <h2>제품 사진</h2>
            <p>사진을 여기에 놓거나 촬영 방법을 선택하세요.</p>
            <div class="upload-actions">
              <button class="button button-primary" id="choose-files" type="button">사진 선택</button>
              <button class="button button-secondary" id="take-photo" type="button">사진 찍기</button>
            </div>
            <small>JPG, PNG · 여러 장 선택 가능</small>
            <input id="file-input" type="file" accept="image/*" multiple hidden />
            <input id="camera-input" type="file" accept="image/*" capture="environment" multiple hidden />
          </div>
          <div id="preview-list" class="preview-list"></div>
          <div class="upload-bottom">
            <button class="text-button" data-go="home" type="button">취소</button>
            <button class="button button-primary" id="analyze-button" type="button" disabled>사진으로 정보 읽기</button>
          </div>
          <p class="notice-banner privacy-banner" role="note">선택한 사진은 제품 정보 인식을 위해 Gemini API로 전송됩니다.</p>
        </section>
      </section>

      <section class="page-view hidden" id="result-page">
        <section class="result-panel" aria-label="인식 정보 확인">
          <div class="result-error hidden" id="result-error" role="alert"></div>
          <div class="result-top">
            <div class="result-photo" id="result-photo" aria-label="선택한 제품 사진"></div>
            <p class="photo-count" id="photo-count-label"></p>
            <button class="text-button edit-photo" data-go="upload" type="button">사진 변경</button>
          </div>
          <form id="product-form">
            <label class="field-label" for="product-name">제품명 <span>*</span></label>
            <input class="form-input" id="product-name" name="name" required placeholder="제품명을 입력해 주세요" />
            <label class="field-label" for="product-expiry">소비기한 <span>*</span></label>
            <input class="form-input date-input" id="product-expiry" name="expiry" type="date" required />
            <p class="field-help">제품 포장에 적힌 날짜를 확인해 주세요.</p>
            <button type="button" class="text-button retry-ocr" id="retry-ocr">사진 다시 인식</button>
            <div class="form-actions">
              <button type="button" class="button button-secondary" data-go="upload">이전</button>
              <button type="submit" class="button button-primary">내 제품에 저장</button>
            </div>
          </form>
        </section>
      </section>

      <section class="page-view hidden" id="success-page">
        <section class="success-card">
          <h2>제품을 저장했어요.</h2>
          <div class="saved-preview" id="saved-preview"></div>
          <button class="button button-primary" data-go="home" type="button">내 제품 보기</button>
          <button class="text-button" data-go="upload" type="button">다른 제품 등록</button>
        </section>
      </section>
    </main>
  </div>

  <dialog class="camera-dialog" id="camera-dialog" aria-labelledby="camera-title">
    <div class="camera-header">
      <div><h2 id="camera-title">제품 사진 찍기</h2><p>제품명과 소비기한이 보이도록 맞춰 주세요.</p></div>
      <button type="button" class="camera-close" id="camera-close" aria-label="카메라 닫기">×</button>
    </div>
    <div class="camera-stage"><video id="camera-video" autoplay playsinline muted></video><div class="camera-frame" aria-hidden="true"></div></div>
    <p class="camera-error hidden" id="camera-error" role="alert"></p>
    <div class="camera-actions">
      <button type="button" class="button button-secondary" id="camera-fallback">사진 파일 선택</button>
      <button type="button" class="button button-primary" id="capture-photo">사진 촬영</button>
    </div>
    <canvas id="camera-canvas" hidden></canvas>
  </dialog>
  <script src="/config.js"></script>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
